<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact | Shinnosuke Yagi</title>
    <link rel="stylesheet" href="../style.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet" />
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
    <style>
        /* ---------- Design Tokens (consistent with other pages) ---------- */
        :root{
            --bg: #f3f6f8;
            --card-bg:#ffffff;
            --text:#1f2937;
            --muted:#6b7280;
            --primary:#0b8f8f;
            --primary-600:#0a7e7e;
            --primary-700:#086c6c;
            --ring: rgba(11,143,143,.35);
            --shadow-sm: 0 2px 10px rgba(0,0,0,.06);
            --shadow-md: 0 10px 30px rgba(0,0,0,.08);
            --radius: 14px;
            --radius-lg: 18px;
            --container: 1600px;
        }
        @media (prefers-color-scheme: dark){
            :root{
                --bg: #0b1214;
                --card-bg:#0f171a;
                --text:#e5e7eb;
                --muted:#9aa3ad;
                --primary:#31c1c1;
                --primary-600:#24b2b2;
                --primary-700:#1aa3a3;
                --ring: rgba(49,193,193,.45);
                --shadow-sm: 0 2px 10px rgba(0,0,0,.35);
                --shadow-md: 0 10px 30px rgba(0,0,0,.45);
            }
        }

        /* ---------- Base ---------- */
        html { scroll-behavior: smooth; }
        *, *::before, *::after { box-sizing: border-box; }
        body{
            margin:0;
            font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, "Noto Sans", "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", sans-serif;
            line-height:1.65;
            color:var(--text);
            background:
                radial-gradient(1200px 600px at 20% -10%, rgba(11,143,143,.10), transparent 60%),
                radial-gradient(900px 500px at 110% 10%, rgba(11,143,143,.08), transparent 55%),
                var(--bg);
        }
        a{
            color:var(--primary-700);
            text-decoration:none;
            transition: color .2s ease, opacity .2s ease;
        }
        a:hover{ color:var(--primary); }
        a:focus-visible{
            outline: 3px solid var(--ring);
            outline-offset: 2px;
            border-radius: 6px;
        }
        img{ max-width:100%; height:auto; display:block; }
        .wrap{
            max-width: var(--container);
            margin-inline:auto;
            padding-inline: 20px;
        }

        /* ---------- Header / Nav ---------- */
        header{
            background: linear-gradient(135deg, var(--primary-700), var(--primary));
            color:#fff;
            position: sticky;
            top: 0;
            z-index: 50;
            box-shadow: var(--shadow-sm);
        }
        header .wrap{
            display:flex;
            align-items:center;
            justify-content:space-between;
            padding-block: 26px;
        }
        header h1{
            margin:0;
            font-size: clamp(1.25rem, 2vw + .5rem, 1.6rem);
            font-weight: 800;
            letter-spacing: .3px;
        }
        nav ul{
            margin:0;
            padding:0;
            list-style:none;
            display:flex;
            gap:22px;
        }
        nav ul li a{
            color:#fff;
            font-weight:600;
            letter-spacing:.2px;
            position:relative;
            padding: 6px 2px;
        }
        nav ul li a::after{
            content:"";
            position:absolute;
            left:0; bottom:-6px;
            width:0%; height:2px;
            background:#fff;
            border-radius:2px;
            transition: width .25s ease;
            opacity:.9;
        }
        nav ul li a:hover::after,
        nav ul li a:focus-visible::after{ width:100%; }

        /* ---------- Page Title ---------- */
        .page-title{
            margin: 28px auto 0;
            padding: 0 20px;
            text-align:center;
        }
        .page-title h2{
            margin: 18px 0 0;
            font-size: clamp(1.45rem, 1.6vw + 1rem, 1.9rem);
            letter-spacing:.3px;
        }

        /* ---------- Section Card ---------- */
        section{
            max-width: var(--container);
            margin: 24px auto 40px;
            padding: clamp(20px, 3vw, 32px);
            background: var(--card-bg);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-md);
        }
        section h2{
            margin-top:0;
            text-align:left;
        }
        section p{
            color: var(--muted);
            margin-top: 6px;
        }

        /* ---------- Contact List ---------- */
        .contact-list{
            list-style:none;
            margin: 18px 0 0;
            padding: 0;
            display: grid;
            gap: 12px;
        }
        .contact-list li{
            display:flex;
            align-items:center;
            gap: 12px;
            padding: 12px 14px;
            border-radius: 12px;
            background: linear-gradient(0deg, rgba(0,0,0,.02), rgba(0,0,0,.02)), #eefaf5;
            box-shadow: 0 2px 8px rgba(0,0,0,.05);
            transition: transform .18s ease, box-shadow .18s ease, background .18s ease;
        }
        .contact-list li:hover{
            transform: translateY(-3px);
            box-shadow: 0 10px 22px rgba(0,0,0,.10);
            background: linear-gradient(0deg, rgba(11,143,143,.04), rgba(11,143,143,.04)), #eefaf5;
        }
        .contact-icon{
            display:grid;
            place-items:center;
            flex: 0 0 38px;
            width: 38px;
            height: 38px;
            border-radius: 10px;
            background: #fff;
            box-shadow: 0 2px 8px rgba(0,0,0,.06);
        }
        .contact-icon img{
            width: 24px;
            height: 24px;
            object-fit: contain;
        }
        .contact-list a{
            color: var(--primary-700);
            font-size: 1rem;
            font-weight: 600;
            text-underline-offset: 3px;
        }
        .contact-list a:hover{ color: var(--primary); }

        /* ---------- Footer ---------- */
        footer{
            background: linear-gradient(180deg, var(--primary-700), var(--primary));
            color:#eef8f8;
            text-align:center;
            padding: 18px;
            border-top-left-radius: var(--radius);
            border-top-right-radius: var(--radius);
            box-shadow: var(--shadow-sm);
            margin-top: 40px;
        }
        footer p{ margin:0; font-size: .95rem; letter-spacing:.2px; }

        /* ---------- Reduced Motion ---------- */
        @media (prefers-reduced-motion: reduce){
            *{ transition: none !important; }
        }
    </style>
</head>
<body>
    <header>
        <div class="wrap">
            <h1><a href="../index.html">Shinnosuke Yagi</a></h1>
            <nav>
                <ul class="nav-list">
                    <li><a href="../index.html">Home</a></li>
                    <li><a href="projects.html">Projects</a></li>
                    <li><a href="memorandum.html">Memorandum</a></li>
                    <li><a href="contact.html">Contact</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <div class="page-title wrap">
        <h2>Contact Me</h2>
    </div>

    <section class="wrap">
        <h2>Get in Touch</h2>
        <p>Feel free to reach out through any of the following:</p>
        <ul class="contact-list">
            <li><span class="contact-icon" aria-hidden="true"><img src="../assets/icons/email.webp" alt=""></span><a href="mailto:syagi2@stanford.edu">syagi2@stanford.edu</a></li>
            <li><span class="contact-icon" aria-hidden="true"><img src="../assets/icons/github.png" alt=""></span><a href="https://github.com/shinorimax">github.com/shinorimax</a></li>
            <li><span class="contact-icon" aria-hidden="true"><img src="../assets/icons/linkedin.png" alt=""></span><a href="https://www.linkedin.com/in/shinnosuke-yagi-1a2914230/">linkedin.com/in/shinnosuke-yagi</a></li>
        </ul>
    </section>

    <footer>
        <p>&copy; 2026 Shinnosuke Yagi</p>
    </footer>
</body>
</html>
