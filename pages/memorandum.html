<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Memorandum | Shinnosuke Yagi</title>
    <link rel="stylesheet" href="../style.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
    <style>
        :root{
            --bg:#f3f6f8;
            --text:#eaf7f5;
            --ink:#1f2937;
            --muted:#9fb3b7;
            --primary:#0b8f8f;
            --primary-700:#086c6c;
            --panel:#f8fbf9;
            --panel-2:#e8f4ef;
            --panel-text:#17252c;
            --panel-muted:#5f7278;
            --line:rgba(169, 226, 221, .34);
            --shadow-md:0 16px 44px rgba(0,0,0,.22);
            --ring:rgba(142,240,189,.45);
            --container:1180px;
        }

        html{ scroll-behavior:smooth; }
        *, *::before, *::after{ box-sizing:border-box; }
        body{
            margin:0;
            font-family:Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
            color:var(--text);
            background:
                linear-gradient(180deg, #071017 0%, #10202a 46%, #f3f6f8 46%, #f3f6f8 100%);
            line-height:1.6;
            min-height:100vh;
        }
        a{
            color:inherit;
            text-decoration:none;
        }
        a:focus-visible,
        button:focus-visible,
        input:focus-visible{
            outline:3px solid var(--ring);
            outline-offset:3px;
        }
        button,
        input{
            font:inherit;
        }
        .wrap{
            max-width:var(--container);
            margin-inline:auto;
            padding-inline:20px;
        }

        header{
            background:linear-gradient(135deg, var(--primary-700), var(--primary));
            color:#fff;
            position:sticky;
            top:0;
            z-index:50;
            box-shadow:0 2px 12px rgba(0,0,0,.14);
        }
        main section{
            max-width:none;
            margin:0;
            padding:0;
            background:transparent;
            box-shadow:none;
            border-radius:0;
        }
        header .wrap{
            display:flex;
            align-items:center;
            justify-content:space-between;
            padding-block:26px;
        }
        header h1{
            margin:0;
            font-size:clamp(1.25rem, 2vw + .5rem, 1.6rem);
            font-weight:800;
            letter-spacing:.3px;
        }
        nav ul{
            margin:0;
            padding:0;
            list-style:none;
            display:flex;
            gap:22px;
            flex-wrap:wrap;
        }
        nav ul li a{
            color:#fff;
            font-weight:600;
            letter-spacing:.2px;
            position:relative;
            padding:6px 2px;
        }
        nav ul li a::after{
            content:"";
            position:absolute;
            left:0;
            bottom:-6px;
            width:0%;
            height:2px;
            background:#fff;
            border-radius:2px;
            transition:width .25s ease;
            opacity:.9;
        }
        nav ul li a:hover::after,
        nav ul li a:focus-visible::after,
        nav ul li a[aria-current="page"]::after{
            width:100%;
        }

        .memo-hero{
            padding:42px 0 20px;
        }
        .memo-title{
            display:grid;
            grid-template-columns:minmax(0, 1fr) auto;
            gap:24px;
            align-items:end;
        }
        .memo-title h2{
            margin:0;
            max-width:780px;
            font-family:"Space Grotesk", Inter, system-ui, sans-serif;
            font-size:clamp(2rem, 5vw, 4.8rem);
            line-height:.98;
            letter-spacing:0;
        }
        .memo-title p{
            margin:16px 0 0;
            color:#c8dad8;
            max-width:640px;
            font-size:1.02rem;
        }
        .memo-count{
            min-width:104px;
            color:#071017;
            background:#8ef0bd;
            border-radius:999px;
            padding:9px 15px;
            font-weight:800;
            text-align:center;
            box-shadow:0 8px 28px rgba(142,240,189,.22);
        }

        .memo-controls{
            display:grid;
            grid-template-columns:minmax(220px, 1fr) auto auto;
            gap:14px;
            align-items:center;
            margin-top:26px;
        }
        .memo-search{
            width:100%;
            border:1px solid rgba(255,255,255,.18);
            color:#eef8f8;
            background:rgba(255,255,255,.08);
            border-radius:8px;
            padding:12px 14px;
            box-shadow:inset 0 1px 0 rgba(255,255,255,.08);
        }
        .memo-search::placeholder{
            color:#9fb3b7;
        }
        .memo-random{
            border:0;
            color:#071017;
            background:#ffd7a8;
            border-radius:8px;
            padding:12px 16px;
            cursor:pointer;
            font-weight:800;
            box-shadow:0 10px 26px rgba(255,215,168,.18);
            transition:transform .16s ease, box-shadow .16s ease;
            white-space:nowrap;
        }
        .memo-random:hover{
            transform:translateY(-2px);
            box-shadow:0 16px 32px rgba(255,215,168,.25);
        }
        .memo-language{
            border:1px solid rgba(255,255,255,.22);
            color:#eef8f8;
            background:rgba(255,255,255,.08);
            border-radius:999px;
            padding:11px 14px;
            cursor:pointer;
            font-weight:800;
            white-space:nowrap;
        }
        .memo-language:hover{
            background:rgba(255,255,255,.16);
        }
        .memo-filters{
            display:flex;
            flex-wrap:wrap;
            gap:9px;
            margin-top:14px;
        }
        .memo-filter{
            border:1px solid rgba(255,255,255,.2);
            color:#dceeed;
            background:rgba(255,255,255,.06);
            border-radius:999px;
            padding:7px 12px;
            cursor:pointer;
            font-weight:700;
            font-size:.9rem;
        }
        .memo-filter.is-active{
            color:#071017;
            border-color:transparent;
            background:#59d2ff;
        }

        .memo-stage{
            display:grid;
            grid-template-columns:minmax(0, 1.5fr) minmax(300px, .7fr);
            gap:22px;
            align-items:stretch;
            margin:28px auto 54px;
        }
        .memo-sky{
            position:relative;
            min-height:640px;
            overflow:hidden;
            border-radius:8px;
            background:
                linear-gradient(135deg, rgba(89,210,255,.11), transparent 34%),
                linear-gradient(315deg, rgba(255,179,92,.12), transparent 35%),
                #08121a;
            box-shadow:var(--shadow-md);
            isolation:isolate;
        }
        .memo-sky::before{
            content:"";
            position:absolute;
            inset:0;
            background-image:
                radial-gradient(circle at 12% 19%, rgba(255,255,255,.72) 0 1px, transparent 1.5px),
                radial-gradient(circle at 39% 12%, rgba(255,255,255,.58) 0 1px, transparent 1.5px),
                radial-gradient(circle at 63% 21%, rgba(255,255,255,.5) 0 1px, transparent 1.5px),
                radial-gradient(circle at 91% 17%, rgba(255,255,255,.65) 0 1px, transparent 1.5px),
                radial-gradient(circle at 16% 82%, rgba(255,255,255,.5) 0 1px, transparent 1.5px),
                radial-gradient(circle at 58% 86%, rgba(255,255,255,.58) 0 1px, transparent 1.5px),
                radial-gradient(circle at 88% 76%, rgba(255,255,255,.48) 0 1px, transparent 1.5px);
            opacity:.62;
            z-index:-1;
        }
        .memo-sky::after{
            content:"";
            position:absolute;
            inset:1px;
            border:1px solid rgba(255,255,255,.08);
            border-radius:8px;
            pointer-events:none;
        }
        .memo-connections{
            position:absolute;
            inset:0;
            width:100%;
            height:100%;
            pointer-events:none;
        }
        .memo-line{
            stroke:var(--line);
            stroke-width:1.4;
            transition:stroke .2s ease, stroke-width .2s ease, opacity .2s ease;
        }
        .memo-line.is-active{
            stroke:rgba(142,240,189,.82);
            stroke-width:2.8;
        }
        .memo-star{
            position:absolute;
            transform:translate(-50%, -50%);
            display:grid;
            place-items:center;
            width:30px;
            height:30px;
            border:0;
            border-radius:50%;
            background:transparent;
            cursor:pointer;
            z-index:2;
        }
        .memo-star-core{
            width:11px;
            height:11px;
            border-radius:50%;
            background:var(--star-color);
            box-shadow:0 0 0 5px rgba(255,255,255,.08), 0 0 24px var(--star-color);
            box-shadow:
                0 0 0 5px color-mix(in srgb, var(--star-color) 22%, transparent),
                0 0 24px var(--star-color);
            transition:transform .18s ease, box-shadow .18s ease;
        }
        .memo-star:hover .memo-star-core,
        .memo-star.is-selected .memo-star-core{
            transform:scale(1.45);
            box-shadow:0 0 0 7px rgba(255,255,255,.12), 0 0 34px var(--star-color);
            box-shadow:
                0 0 0 7px color-mix(in srgb, var(--star-color) 28%, transparent),
                0 0 34px var(--star-color);
        }
        .memo-star.is-related .memo-star-core{
            transform:scale(1.2);
        }
        .memo-star-label{
            position:absolute;
            left:22px;
            top:50%;
            transform:translateY(-50%);
            width:min(190px, 30vw);
            color:#edfafa;
            background:rgba(8,18,26,.76);
            border:1px solid rgba(255,255,255,.12);
            border-radius:8px;
            padding:7px 9px;
            font-size:.78rem;
            line-height:1.25;
            text-align:left;
            opacity:0;
            pointer-events:none;
            transition:opacity .18s ease, transform .18s ease;
        }
        .memo-star:hover .memo-star-label,
        .memo-star.is-selected .memo-star-label{
            opacity:1;
            transform:translate(4px, -50%);
        }

        .memo-detail{
            background:var(--panel);
            color:var(--panel-text);
            border:1px solid rgba(8,18,26,.08);
            border-radius:8px;
            box-shadow:var(--shadow-md);
            padding:24px;
            min-height:360px;
            align-self:stretch;
        }
        .memo-detail-kicker,
        .memo-source{
            color:var(--panel-muted);
            font-size:.84rem;
            font-weight:800;
            text-transform:uppercase;
            letter-spacing:.08em;
        }
        .memo-detail h2{
            margin:12px 0 12px;
            color:var(--panel-text);
            font-family:"Space Grotesk", Inter, system-ui, sans-serif;
            font-size:clamp(1.35rem, 1.3vw + 1rem, 2rem);
            line-height:1.15;
            letter-spacing:0;
        }
        .memo-detail p{
            margin:0 0 18px;
            color:#31464d;
            font-size:1rem;
        }
        .memo-actions{
            display:flex;
            flex-wrap:wrap;
            gap:8px;
            margin-top:18px;
        }
        .memo-web{
            display:inline-flex;
            align-items:center;
            justify-content:center;
            gap:7px;
            border:1px solid rgba(8,18,26,.12);
            color:#071017 !important;
            background:#59d2ff !important;
            border-radius:999px;
            padding:9px 13px;
            cursor:pointer;
            font-weight:800;
            font-size:.86rem;
            line-height:1.2;
            text-decoration:none !important;
            box-shadow:0 8px 18px rgba(89,210,255,.22);
        }
        .memo-web:hover{
            color:#071017 !important;
            background:#8ee6ff !important;
            transform:translateY(-1px);
        }
        .memo-related{
            display:flex;
            flex-wrap:wrap;
            gap:8px;
            margin-top:22px;
        }
        .memo-related h3{
            flex-basis:100%;
            margin:0 0 2px;
            color:var(--panel-text);
            font-size:.95rem;
        }
        .memo-related button{
            border:1px solid rgba(8,18,26,.12);
            color:#0d4d4d;
            background:var(--panel-2);
            border-radius:999px;
            padding:7px 10px;
            cursor:pointer;
            font-size:.82rem;
            line-height:1.2;
        }
        .memo-related button:hover{
            background:#d9eee7;
        }
        .memo-empty{
            color:#31464d;
        }

        footer{
            background:linear-gradient(180deg, var(--primary-700), var(--primary));
            color:#eef8f8;
            text-align:center;
            padding:18px;
            border-top-left-radius:14px;
            border-top-right-radius:14px;
            margin-top:40px;
        }
        footer p{
            margin:0;
            font-size:.95rem;
            letter-spacing:.2px;
        }

        @media (max-width:900px){
            .memo-title,
            .memo-stage{
                grid-template-columns:1fr;
            }
            .memo-count{
                justify-self:start;
            }
            .memo-sky{
                min-height:560px;
            }
        }
        @media (max-width:640px){
            header .wrap{
                align-items:flex-start;
                flex-direction:column;
                gap:12px;
                padding-block:18px;
            }
            nav ul{
                gap:14px;
            }
            .memo-controls{
                grid-template-columns:1fr;
            }
            .memo-sky{
                min-height:520px;
            }
            .memo-star-label{
                display:none;
            }
        }
        @media (prefers-reduced-motion:reduce){
            *{
                transition:none !important;
                scroll-behavior:auto !important;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="wrap">
            <h1>Shinnosuke Yagi</h1>
            <nav>
                <ul class="nav-list">
                    <li><a href="../index.html">Home</a></li>
                    <li><a href="projects.html">Projects</a></li>
                    <li><a href="memorandum.html" aria-current="page"><span aria-hidden="true">✨</span> Memorandum</a></li>
                    <li><a href="contact.html">Contact</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <section class="memo-hero">
            <div class="wrap">
                <div class="memo-title">
                    <div>
                        <h2 data-i18n="heroTitle">Memorandum Constellation</h2>
                        <p data-i18n="heroDescription">A living map of small questions, everyday trivia, and useful fragments I want to remember.</p>
                    </div>
                    <div class="memo-count" data-count>0 notes</div>
                </div>

                <div class="memo-controls" aria-label="Memorandum controls" data-i18n-aria="controlsLabel">
                    <input class="memo-search" data-search type="search" placeholder="Search questions, answers, topics" />
                    <button class="memo-random" data-random type="button" data-i18n="randomNote">Random note</button>
                    <button class="memo-language" data-language-toggle type="button" aria-pressed="false">日本語</button>
                </div>
                <div class="memo-filters" data-filters aria-label="Topic filters"></div>
            </div>
        </section>

        <section class="memo-stage wrap" aria-label="Memorandum constellation">
            <div class="memo-sky" data-sky>
                <svg class="memo-connections" data-connections aria-hidden="true"></svg>
            </div>
            <aside class="memo-detail" data-detail aria-live="polite"></aside>
        </section>
    </main>

    <footer>
        <p>&copy; 2025 Shinnosuke Yagi</p>
    </footer>

    <script src="../assets/memorandum-data.js"></script>
    <script src="../assets/memorandum.js"></script>
</body>
</html>
